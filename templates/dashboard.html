<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Traffic-Guard - Admin Dashboard</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
        <style>
            body {
                background: #0f172a;
                color: #e2e8f0;
                font-family: 'Inter', system-ui, sans-serif;
            }
            .card {
                background: #1e293b;
                border: 1px solid #334155;
                border-radius: 10px;
                padding: 0.85rem;
            }
            .stat-value {
                font-size: 1.5rem;
                font-weight: 700;
                line-height: 1.2;
            }
            .badge-bypass {
                background: #059669;
                color: white;
            }
            .badge-active {
                background: #dc2626;
                color: white;
            }
            .toggle-btn {
                transition: all 0.3s;
            }
            .toggle-btn.active {
                background: #059669;
            }
            .toggle-btn.inactive {
                background: #475569;
            }
            input[type='range'] {
                accent-color: #3b82f6;
            }
            input[type='number'] {
                background: #0f172a;
                border: 1px solid #475569;
                color: #e2e8f0;
                border-radius: 6px;
                padding: 0.25rem 0.5rem;
                width: 100%;
                font-size: 0.875rem;
            }
            .pulse {
                animation: pulse 2s infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.6;
                }
            }
        </style>
    </head>
    <body class="h-screen w-screen overflow-hidden p-4 flex flex-col">
        <div class="max-w-7xl mx-auto w-full flex flex-col h-full justify-between gap-3">
            <!-- Header -->
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold text-white flex items-center gap-2">
                        🚦 Traffic-Guard Dashboard
                    </h1>
                    <p class="text-slate-400 text-xs">
                        Virtual Waiting Room — Real-time Control Panel
                    </p>
                </div>
                <div id="connectionStatus" class="flex items-center gap-2 text-xs">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-500 pulse" id="wsIndicator"></span>
                    <span id="wsText" class="text-slate-300">Connecting…</span>
                </div>
            </div>

            <!-- Key Metrics Row (4x2 Compact Grid) -->
            <div class="grid grid-cols-4 gap-3">
                <div class="card text-center py-2">
                    <p class="text-slate-400 text-xs mb-0.5">Waiting</p>
                    <p class="stat-value text-amber-400" id="waitingCount">-</p>
                </div>
                <div class="card text-center py-2">
                    <p class="text-slate-400 text-xs mb-0.5">Active Users</p>
                    <p class="stat-value text-green-400" id="activeCount">-</p>
                </div>
                <div class="card text-center py-2">
                    <p class="text-slate-400 text-xs mb-0.5">Mode</p>
                    <p class="mt-1">
                        <span
                            id="modeBadge"
                            class="px-2.5 py-0.5 rounded-full text-xs font-semibold badge-bypass"
                            >—</span
                        >
                    </p>
                </div>
                <div class="card text-center py-2">
                    <p class="text-slate-400 text-xs mb-0.5">Current TPS</p>
                    <p class="stat-value text-blue-400" id="currentTps">-</p>
                </div>

                <div class="card text-center py-2">
                    <p class="text-slate-400 text-xs mb-0.5">CPU Usage</p>
                    <p class="stat-value" id="cpuValue" style="color: #f59e0b">-</p>
                </div>
                <div class="card text-center py-2">
                    <p class="text-slate-400 text-xs mb-0.5">Active Connections</p>
                    <p class="stat-value text-purple-400" id="activeConns">-</p>
                </div>
                <div class="card text-center py-2">
                    <p class="text-slate-400 text-xs mb-0.5">5xx Error Rate</p>
                    <p class="stat-value text-red-400" id="errRate">-</p>
                </div>
                <div class="card text-center py-2">
                    <p class="text-slate-400 text-xs mb-0.5">Total Passed</p>
                    <p class="stat-value text-emerald-400" id="totalPassed">-</p>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="grid md:grid-cols-3 gap-3 flex-1 min-h-0">
                <!-- Traffic Chart -->
                <div class="card md:col-span-2 flex flex-col justify-between h-full">
                    <h3 class="text-xs font-semibold text-slate-300 mb-1">
                        📈 Traffic (60s window)
                    </h3>
                    <div class="relative w-full h-full min-h-0 flex-1">
                        <canvas id="trafficChart"></canvas>
                    </div>
                </div>

                <!-- CPU Gauge Chart -->
                <div class="card flex flex-col justify-between h-full">
                    <h3 class="text-xs font-semibold text-slate-300 mb-1">🔥 Downstream CPU</h3>
                    <div
                        class="relative w-full h-full min-h-0 flex-1 flex items-center justify-center">
                        <canvas id="cpuChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Controls Footer -->
            <div class="card py-3">
                <div class="grid grid-cols-2 md:grid-cols-6 gap-3 items-end">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Bypass Threshold</label>
                        <input type="number" id="inpThreshold" min="1" value="500" />
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Active TTL (sec)</label>
                        <input type="number" id="inpTtl" min="10" value="300" />
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1"
                            >Batch Size:
                            <span id="batchLabel" class="text-blue-400 font-bold">50</span></label
                        >
                        <input
                            type="range"
                            id="inpBatch"
                            min="1"
                            max="500"
                            value="50"
                            class="w-full"
                            oninput="
                                document.getElementById('batchLabel').textContent = this.value
                            " />
                    </div>
                    <div
                        class="flex items-center justify-between bg-slate-900/50 p-1.5 rounded-lg border border-slate-700/50">
                        <span class="text-xs text-slate-400">Auto Throttle</span>
                        <button
                            id="btnAutoThrottle"
                            class="toggle-btn active px-2.5 py-1 rounded text-xs font-semibold"
                            onclick="toggleAutoThrottle()">
                            ON
                        </button>
                    </div>
                    <div
                        class="flex items-center justify-between bg-slate-900/50 p-1.5 rounded-lg border border-slate-700/50">
                        <span class="text-xs text-slate-400">Pause Queue</span>
                        <button
                            id="btnPause"
                            class="toggle-btn inactive px-2.5 py-1 rounded text-xs font-semibold"
                            onclick="togglePause()">
                            OFF
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <button
                            onclick="applyConfig()"
                            class="w-full bg-blue-600 hover:bg-blue-700 py-1.5 rounded text-xs font-semibold text-white transition-colors">
                            💾 Apply
                        </button>
                        <button
                            onclick="flushQueue()"
                            class="w-full bg-red-600 hover:bg-red-700 py-1.5 rounded text-xs font-semibold text-white transition-colors">
                            🗑️ Flush
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            let autoThrottling = true;
            let isPaused = false;

            const MAX_POINTS = 60;
            const labels = Array.from({ length: MAX_POINTS }, (_, i) => '');
            const waitingData = new Array(MAX_POINTS).fill(0);
            const activeData = new Array(MAX_POINTS).fill(0);
            const tpsData = new Array(MAX_POINTS).fill(0);

            const trafficCtx = document.getElementById('trafficChart').getContext('2d');
            const trafficChart = new Chart(trafficCtx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'Waiting',
                            data: waitingData,
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245,158,11,0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 0,
                        },
                        {
                            label: 'Active',
                            data: activeData,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16,185,129,0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 0,
                        },
                        {
                            label: 'TPS',
                            data: tpsData,
                            borderColor: '#3b82f6',
                            borderDash: [5, 3],
                            tension: 0.3,
                            pointRadius: 0,
                        },
                    ],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 300 },
                    scales: {
                        x: { display: false },
                        y: {
                            beginAtZero: true,
                            grid: { color: '#1e293b' },
                            ticks: { color: '#94a3b8', font: { size: 10 } },
                        },
                    },
                    plugins: {
                        legend: { labels: { color: '#94a3b8', boxWidth: 12, font: { size: 11 } } },
                    },
                },
            });

            const cpuCtx = document.getElementById('cpuChart').getContext('2d');
            const cpuChart = new Chart(cpuCtx, {
                type: 'doughnut',
                data: {
                    labels: ['CPU Used', 'CPU Free'],
                    datasets: [
                        {
                            data: [0, 100],
                            backgroundColor: ['#f59e0b', '#1e293b'],
                            borderWidth: 0,
                        },
                    ],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false },
                    },
                },
            });

            function connectWS() {
                const proto = location.protocol === 'https:' ? 'wss' : 'ws';
                const ws = new WebSocket(`${proto}://${location.host}/ws/admin/metrics`);

                ws.onopen = () => {
                    document.getElementById('wsIndicator').className =
                        'w-2.5 h-2.5 rounded-full bg-green-500';
                    document.getElementById('wsText').textContent = 'Connected';
                };
                ws.onclose = () => {
                    document.getElementById('wsIndicator').className =
                        'w-2.5 h-2.5 rounded-full bg-red-500 pulse';
                    document.getElementById('wsText').textContent = 'Reconnecting…';
                    setTimeout(connectWS, 2000);
                };
                ws.onerror = () => ws.close();

                ws.onmessage = (evt) => {
                    const d = JSON.parse(evt.data);

                    document.getElementById('waitingCount').textContent = d.waiting_count;
                    document.getElementById('activeCount').textContent = d.active_count;
                    document.getElementById('currentTps').textContent = d.current_tps;
                    document.getElementById('cpuValue').textContent = d.cpu_usage.toFixed(1) + '%';
                    document.getElementById('activeConns').textContent = d.active_connections;
                    document.getElementById('errRate').textContent =
                        (d.http_5xx_rate * 100).toFixed(2) + '%';
                    document.getElementById('totalPassed').textContent = d.total_passed;

                    const badge = document.getElementById('modeBadge');
                    if (d.mode === 'BYPASS') {
                        badge.textContent = '✅ BYPASS';
                        badge.className =
                            'px-2.5 py-0.5 rounded-full text-xs font-semibold badge-bypass';
                    } else {
                        badge.textContent = '🔴 QUEUE ACTIVE';
                        badge.className =
                            'px-2.5 py-0.5 rounded-full text-xs font-semibold badge-active';
                    }

                    const cpuEl = document.getElementById('cpuValue');
                    cpuEl.style.color =
                        d.cpu_usage >= 90 ? '#ef4444' : d.cpu_usage >= 80 ? '#f59e0b' : '#10b981';

                    autoThrottling = d.auto_throttling_enabled;
                    isPaused = d.is_paused;
                    const btnAT = document.getElementById('btnAutoThrottle');
                    btnAT.textContent = autoThrottling ? 'ON' : 'OFF';
                    btnAT.className =
                        'toggle-btn ' +
                        (autoThrottling ? 'active' : 'inactive') +
                        ' px-2.5 py-1 rounded text-xs font-semibold';
                    const btnP = document.getElementById('btnPause');
                    btnP.textContent = isPaused ? 'PAUSED' : 'OFF';
                    btnP.className =
                        'toggle-btn ' +
                        (isPaused ? 'active' : 'inactive') +
                        ' px-2.5 py-1 rounded text-xs font-semibold';

                    document.getElementById('inpThreshold').value = d.bypass_threshold;
                    document.getElementById('inpTtl').value = d.active_ttl_sec;
                    document.getElementById('inpBatch').value = d.base_batch_size;
                    document.getElementById('batchLabel').textContent = d.base_batch_size;

                    waitingData.push(d.waiting_count);
                    waitingData.shift();
                    activeData.push(d.active_count);
                    activeData.shift();
                    tpsData.push(d.current_tps);
                    tpsData.shift();
                    trafficChart.update();

                    cpuChart.data.datasets[0].data = [d.cpu_usage, 100 - d.cpu_usage];
                    cpuChart.data.datasets[0].backgroundColor[0] =
                        d.cpu_usage >= 90 ? '#ef4444' : d.cpu_usage >= 80 ? '#f59e0b' : '#10b981';
                    cpuChart.update();
                };
            }
            connectWS();

            function toggleAutoThrottle() {
                autoThrottling = !autoThrottling;
            }
            function togglePause() {
                isPaused = !isPaused;
            }

            async function applyConfig() {
                const body = {
                    bypass_threshold: parseInt(document.getElementById('inpThreshold').value),
                    active_ttl_sec: parseInt(document.getElementById('inpTtl').value),
                    base_batch_size: parseInt(document.getElementById('inpBatch').value),
                    auto_throttling_enabled: autoThrottling,
                    is_paused: isPaused,
                };
                const res = await fetch('/admin/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const data = await res.json();
                console.log('Config updated:', data);
            }

            async function flushQueue() {
                if (!confirm('Flush all queues? This cannot be undone.')) return;
                await fetch('/admin/queue/flush', { method: 'POST' });
            }
        </script>
    </body>
</html>
